{% extends "base.html" %}
{% block title %}История — {{ disk_name }}{% endblock %}
{% block main %}<div class="yd-main-head"><span class="yd-main-title"><i class="bi bi-clock-history" style="color:#E0A800"></i> История</span></div><div class="yd-content"><div style="max-width:850px"><div class="list-group">{% for a in activities %}<div class="list-group-item d-flex align-items-center gap-3"><i class="bi bi-{% if a.action == 'upload' %}cloud-arrow-up{% else %}activity{% endif %}" style="color:#E0A800;font-size:20px"></i><div><b>{{ a.action }}</b>{% if a.path %} — {{ a.path }}{% endif %}<div class="text-muted small">{{ a.created_at.strftime('%d.%m.%Y %H:%M') }}</div></div></div>{% else %}<div class="yd-empty"><h3>История пуста</h3></div>{% endfor %}</div></div></div>{% endblock %}
