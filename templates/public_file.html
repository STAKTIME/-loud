<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ name }}</title><style>body{font-family:Segoe UI,Arial;background:#faf9f5;text-align:center;padding:8vh 20px;color:#24221d}.card{background:#fff;max-width:900px;margin:auto;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}img{max-width:100%;max-height:75vh;object-fit:contain}.btn{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:9px;background:#ffcc00;color:#24221d;text-decoration:none}</style></head><body><div class="card"><h2>{{ name }}</h2>{% set ext=name.rsplit('.',1)[-1].lower() if '.' in name else '' %}{% if ext in ['jpg','jpeg','png','gif','webp','bmp','svg'] %}<img src="{{ url_for('public.view_shared', token=share.token) }}" alt="{{ name }}">{% else %}<p>Просмотр этого типа файла в браузере недоступен.</p>{% endif %}<p>Скачивание отключено владельцем ссылки.</p></div></body></html>
