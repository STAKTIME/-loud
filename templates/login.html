{% extends "_auth_base.html" %}
{% block title %}Вход — {{ disk_name }}{% endblock %}
{% block card %}
<div class="logo"><i class="bi bi-cloud-fill"></i></div>
<h1>{{ disk_name }}</h1>
<p class="sub">Введите пароль, который вам выдал администратор</p>
<form method="POST">
    <div class="field">
        <input type="password" name="password" placeholder="Пароль" required autofocus autocomplete="current-password">
        <button type="button" class="eye" title="Показать пароль"><i class="bi bi-eye"></i></button>
    </div>
    <button type="submit" class="btn"><i class="bi bi-unlock-fill"></i> Открыть диск</button>
</form>
<p class="foot">Нет пароля? Попросите владельца диска добавить вас.</p>
{% endblock %}
