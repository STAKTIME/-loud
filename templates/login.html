<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Диск</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --yd-yellow: #FFDB4D; --yd-yellow-dark: #FCC521; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
        .yd-header { height: 60px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; padding: 0 24px; gap: 10px; }
        .yd-logo-badge { width: 28px; height: 28px; background: #FC3F1D; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
        .yd-logo-badge svg { width: 18px; height: 18px; }
        .yd-header span { font-size: 17px; font-weight: 700; }
        .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.10); padding: 40px; width: 100%; max-width: 380px; border: none; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .sub { color: #999; font-size: 14px; margin-bottom: 28px; }
        .form-label { font-size: 13px; font-weight: 500; color: #555; margin-bottom: 5px; }
        .form-control { border: 1.5px solid #ddd; border-radius: 10px; padding: 10px 14px; font-size: 14px; transition: border-color .2s; }
        .form-control:focus { border-color: var(--yd-yellow-dark); box-shadow: 0 0 0 3px rgba(252,197,33,.15); }
        .btn-main { background: var(--yd-yellow); color: #1c1b20; border: none; border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; transition: background .15s; }
        .btn-main:hover { background: var(--yd-yellow-dark); }
        .yd-link { font-size: 14px; color: #999; text-align: center; margin-top: 18px; }
        .yd-link a { color: #1c1b20; font-weight: 500; text-decoration: none; }
        .yd-link a:hover { text-decoration: underline; }
        .alert { border-radius: 10px; border: none; font-size: 13px; padding: 10px 14px; }
    </style>
</head>
<body>
    <div class="yd-header">
        <div class="yd-logo-badge">
            <svg viewBox="0 0 18 18" fill="none"><path d="M10.4 2H8.2C6.6 2 5.5 3.1 5.5 5.02 5.5 6.68 6.2 7.5 7.4 8.3l.9.56L5.1 14h2.1l2.8-5.4-1-.65C7.9 7.18 7.3 6.6 7.3 5.2c0-.9.6-1.4 1.56-1.4h1.54V2Z" fill="#fff"/><path d="M10.4 2H12V14h-2V3.8h.4V2Z" fill="#fff"/></svg>
        </div>
        <span>Диск</span>
    </div>
    <div class="wrap">
        <div class="card">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} mb-3">{{ message | safe }}</div>
                {% endfor %}
            {% endwith %}
            <h1>Вход</h1>
            <p class="sub">Войдите в свой аккаунт</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" class="form-control" name="username" placeholder="Имя пользователя" required autofocus autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" name="password" placeholder="Пароль" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-main">Войти</button>
            </form>
            <p class="yd-link">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрируйтесь</a></p>
        </div>
    </div>
</body>
</html>
