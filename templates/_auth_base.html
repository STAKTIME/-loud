<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFCC00">
    <title>{% block title %}{{ disk_name }}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
            background: #FAF9F5; color: #24221D;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 6px; background: #FFCC00; }
        .card { background: #fff; border-radius: 22px; border: 1px solid #ECE8DC; box-shadow: 0 16px 48px rgba(36,34,29,.08); padding: 36px 32px 30px; width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; background: #FFCC00; display: flex; align-items: center; justify-content: center; color: #3D3000; font-size: 36px; }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .sub { color: #8F8B80; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .field { position: relative; margin-bottom: 14px; text-align: left; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #5C5A55; margin-bottom: 6px; }
        .field input { width: 100%; border: 2px solid #ECE8DC; border-radius: 14px; padding: 13px 46px 13px 16px; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; font-family: inherit; }
        .field input:focus { border-color: #FFCC00; box-shadow: 0 0 0 4px rgba(255,204,0,.25); }
        .eye { position: absolute; right: 8px; bottom: 7px; width: 36px; height: 36px; border: none; background: none; color: #8F8B80; font-size: 18px; cursor: pointer; border-radius: 10px; }
        .eye:hover { background: #FFF6D1; color: #24221D; }
        .btn { width: 100%; border: none; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; color: #24221D; cursor: pointer; background: #FFCC00; transition: background .15s, transform .1s; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background: #F2BC00; }
        .btn:active { transform: scale(.98); }
        .alert { border-radius: 12px; font-size: 14px; padding: 11px 14px; margin-bottom: 16px; text-align: left; display: flex; gap: 8px; align-items: flex-start; }
        .alert-danger { background: #FDECEC; color: #B71C1C; }
        .alert-success { background: #E8F5E9; color: #1B5E20; }
        .alert-info, .alert-warning { background: #FFF6D1; color: #5C4700; }
        .foot { margin-top: 18px; font-size: 12px; color: #A9A598; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}"><i class="bi bi-{{ 'exclamation-circle-fill' if category == 'danger' else 'info-circle-fill' }}"></i><span>{{ message|safe }}</span></div>
            {% endfor %}
        {% endwith %}
        {% block card %}{% endblock %}
    </div>
    <script>
    document.querySelectorAll('.eye').forEach(b => b.addEventListener('click', () => {
        const inp = b.parentElement.querySelector('input');
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        b.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        inp.focus();
    }));
    </script>
</body>
</html>
